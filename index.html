          <button class="thumb">

        </div>
      </section>
      <section class="text">
        <div class="text1">
          <h3> Sneaker Company</h3><br>
          <h1>Fall Limited Edition <br>Sneakers</h1><br><br>
          <p> These low-profile sneakers are your perfect casual wear <br>companion. Featuring a
            durable rubber outer sole, they’ll <br>withstand everything the weather can offer.
          </p>
        </div>
        <div class="text2">
          <div class="b1">
            <p class="number"> $125.00</p>
            <p class="pourcent"> 50%</p>
          </div>
          <div class="b2">
            <p>$250.00</p>
          </div>
        </div>
        <div class="btn">
          <button class="btn1">
            <img src="/images/icon-minus.svg" alt="">
            <span>0</span>
            <img src="/images/icon-plus.svg" alt="">
          </button>
          <button class="btn2">
            <img src="/images/icon-cart.svg" alt="">
            <p>Add to cart</p>
          </button>
          <button class="click">On click</button>
        </div>
      </section>
    </main>
  </div>

    let navbar = document.querySelector(".navbar");
    let menu = document.querySelector(".menu");
    const a = document.querySelectorAll(".a")
    a.forEach(link => {
      link.addEventListener("click", (e) => {
        e.preventDefault();

        a.forEach(l => l.classList.remove("active")
        );
        link.classList.add("active")

      });
    });

    menu.addEventListener("click",
      function () {
        navbar.classList.toggle("active")
      }
    );


    const prev = document.querySelector(".btn-previous.prev")
    const next = document.querySelector(".btn-previous.next")
    const carouselimage = document.querySelectorAll(".carousel img")
    const carousel = document.querySelector(".carousel")
    let currentIndex = 0;
    const totalImages = carouselimage.length;
    const thumbnail = document.querySelectorAll(".thumb")
    thumbnail.forEach((thumb, index) => {
      thumb.addEventListener("click", () => {
        currentIndex = index;
        updateCarousel();
      });
    });
    function updateCarousel() {
      const offset = ((currentIndex) * -100);
      carousel.style.transform = `translateX(${offset}%)`;
      thumbnail.forEach((thumb, index) => {
        thumb.classList.toggle("actif", index === currentIndex)
      })
    }
    next.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + totalImages) % totalImages;
      updateCarousel();
    });
    prev.addEventListener("click", () => {
      currentIndex = (currentIndex + 1 + totalImages) % totalImages;
      updateCarousel();
    });
